<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RegensPurge</title>
  <style>
    :root{--bg:#1b1a17;--panel:rgba(57,44,33,.88);--gold:#d7b36a;--gold-dark:#b98245;--text:#fffaf2;--muted:#f4e4c8;--shadow:0 18px 34px rgba(24,18,12,.28)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--bg)}
    body{min-height:100vh;background-image:linear-gradient(135deg,rgba(24,18,15,.78),rgba(39,30,24,.66)),url("Wallpaper/Regensburg_Alte_Bruecke_mit_Altstadt.jpg");background-size:cover;background-position:center;background-attachment:fixed}
    button,input{font:inherit}.app{width:min(1200px,calc(100% - 24px));margin:auto;padding:20px 0 40px}.topbar,.leaderboard-panel,.gamelog-panel{background:var(--panel);backdrop-filter:blur(8px);border:1px solid rgba(245,213,143,.25);border-radius:18px;box-shadow:var(--shadow)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 24px}.title{margin:0;color:var(--gold);font-size:clamp(2rem,5vw,3rem)}.subtitle{margin:6px 0 0;color:var(--muted)}.player-panel{display:flex;align-items:end;justify-content:flex-end;gap:12px;flex-wrap:wrap}.player-actions{display:flex;align-items:end;gap:8px}.player-input-wrap{display:grid;gap:6px;color:var(--muted);font-size:.85rem}.player-input-wrap input,.points-input{min-width:150px;padding:9px 11px;border:1px solid #9c8053;border-radius:8px;background:#241c17;color:var(--text)}
    button{border:0;border-radius:9px;padding:10px 14px;background:var(--gold);color:#241c17;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.08)}button:disabled{opacity:.55;cursor:not-allowed}.reset-btn{background:#713e31;color:white}.score-box{min-width:88px;padding:8px 13px;border-radius:10px;background:#241c17;text-align:center}.score-label{display:block;color:var(--muted);font-size:.8rem}.score-value{font-size:1.5rem;font-weight:bold;color:var(--gold)}
    .leaderboard-panel,.gamelog-panel{margin-top:16px;padding:16px 20px}.leaderboard-title,.gamelog-title{margin:0 0 10px;color:var(--gold)}.leaderboard-list{display:flex;gap:10px;flex-wrap:wrap;margin:0;padding:0;list-style:none}.leaderboard-item{padding:7px 11px;border-radius:8px;background:rgba(0,0,0,.2)}.leaderboard-name{font-weight:bold}.leaderboard-score{color:var(--gold)}
    .board{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:22px;margin-top:24px}.task-card{display:flex;flex-direction:column;min-height:440px;overflow:hidden;color:#2e1f16;border:1px solid rgba(89,66,49,.2);border-radius:24px;background:linear-gradient(180deg,rgba(245,233,214,.96),rgba(234,222,202,.94));box-shadow:var(--shadow)}.card-image-wrap{width:100%;aspect-ratio:1/1.5;overflow:hidden;background:rgba(255,255,255,.18);border-bottom:1px solid rgba(79,58,43,.18)}.card-image-wrap img{display:block;width:100%;height:100%;object-fit:cover}.task-body{display:flex;flex:1;flex-direction:column;padding:16px}.task-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.task-id{display:inline-flex;padding:7px 12px;border:1px solid rgba(162,128,82,.28);border-radius:999px;background:rgba(162,128,82,.14);color:#4d3528;font-size:.8rem;font-weight:700}.task-timer{color:#5e4738;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}.task-timer.warning{color:#a46a3d}.task-timer.danger{color:#b54b42}.task-points{margin:0 0 14px;color:#5e4738;font-weight:700}.task-button{width:100%;margin-top:auto;border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--text);font-weight:900;text-transform:uppercase}.task-button:disabled{background:#8c8173;cursor:not-allowed}.finish-screen{display:none;margin-top:24px;padding:30px;text-align:center;background:rgba(56,43,35,.85);border-radius:24px}.finish-screen.show{display:block}.finish-screen h2{color:#fff5dd}.restart-btn{margin-top:8px}.empty-message{padding:18px;color:var(--muted);text-align:center}
    .gamelog-list{display:grid;gap:7px;margin:0;padding:0;list-style:none;max-height:300px;overflow:auto}.gamelog-entry{display:flex;justify-content:space-between;gap:12px;padding:9px 11px;border-radius:8px;background:rgba(0,0,0,.2)}.gamelog-time{color:var(--muted);font-size:.85rem;white-space:nowrap}
    .modal{display:none;position:fixed;inset:0;z-index:5;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.7)}.modal.show{display:flex}.modal-card{width:min(420px,100%);padding:22px;border:1px solid rgba(245,213,143,.35);border-radius:16px;background:#30251d;box-shadow:var(--shadow)}.modal-card h2{margin-top:0;color:var(--gold)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.secondary-btn{background:#75634b;color:white}.custom-points-wrap{display:none;margin-top:12px}.custom-points-wrap.show{display:grid;gap:6px}.custom-points-wrap label{color:var(--muted)}#toast{position:fixed;left:50%;bottom:24px;z-index:10;transform:translateX(-50%);padding:12px 20px;border-radius:999px;background:#241c17;color:white;opacity:0;pointer-events:none;transition:opacity .2s}
    @media(max-width:900px){.board{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.player-panel{width:100%;justify-content:space-between}}
    @media(max-width:560px){.app{width:calc(100% - 16px);padding-top:12px}.topbar{padding:16px}.player-panel{display:grid;grid-template-columns:1fr}.player-actions{width:100%;flex-wrap:wrap}.player-input-wrap input,.player-actions button,.reset-btn{width:100%;min-width:0}.card-image-wrap{aspect-ratio:1/1.5}.gamelog-entry{flex-direction:column;gap:4px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div><h1 class="title">RegensPurge</h1><p class="subtitle">Missionen, Punkte &amp; Abenteuer</p></div>
      <div class="player-panel">
        <div class="player-actions"><label class="player-input-wrap">Spielername<input id="playerNameInput" type="text" value="Spieler" maxlength="22" /></label><button id="playerNameConfirmBtn" type="button">Name speichern</button></div>
        <button id="resetAllBtn" class="reset-btn" type="button">Daten löschen</button>
        <div class="score-box"><span class="score-label">Punkte</span><span id="scoreValue" class="score-value">0</span></div>
      </div>
    </header>
    <section class="leaderboard-panel"><h2 class="leaderboard-title">Bestenliste</h2><ol id="leaderboardList" class="leaderboard-list"></ol></section>
    <main id="board" class="board" aria-live="polite"></main>
    <section id="finishScreen" class="finish-screen"><h2>Runde beendet!</h2><p id="finishSummary"></p><button id="newGameBtn" class="restart-btn" type="button">Neues Spiel</button></section>
    <section class="gamelog-panel"><h2 class="gamelog-title">Gamelog</h2><ol id="gamelogList" class="gamelog-list"></ol></section>
  </div>
  <div id="confirmModal" class="modal" aria-modal="true" role="dialog" aria-labelledby="confirmTitle"><div class="modal-card"><h2 id="confirmTitle">Aufgabe erledigt?</h2><p id="confirmText">Bist du sicher?</p><div id="customPointsWrap" class="custom-points-wrap"><label for="customPointsInput">Punkte</label><input id="customPointsInput" class="points-input" type="number" min="0" step="1" /></div><div class="modal-actions"><button id="cancelConfirmBtn" class="secondary-btn" type="button">Abbrechen</button><button id="confirmBtn" type="button">Bestätigen</button></div></div></div>
  <div id="toast" aria-live="polite"></div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDXyTteMhe2rotr64TMQ6w5mGoUCTDDrrA",
      authDomain: "regenspurge.firebaseapp.com",
      databaseURL: "https://regenspurge-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "regenspurge",
      storageBucket: "regenspurge.firebasestorage.app",
      messagingSenderId: "706439523349",
      appId: "1:706439523349:web:0db0ac82a9241ee184321c",
      measurementId: "G-K758M4BMPZ",
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const GAME_REF = ref(db, "gameState");
    const CATALOG_VERSION = 38;
    const INITIAL_TASK_COUNT = 3;
    const BOARD_TARGET_COUNT = 3;
    const SECOND_PLAYER_TIME_MS = 5 * 60 * 1000;
    const tasks = [
      { id: 1, image: "card-small(1).png", points: 20, customPoints: false, timeMinutes: 15 },
      { id: 2, image: "card-small (2).png", points: 2, customPoints: true, timeMinutes: 20 },
      { id: 3, image: "card-small (3).png", points: 2, customPoints: false, timeMinutes: 15 },
      { id: 4, image: "card-small (4).png", points: 3, customPoints: false, timeMinutes: 18 },
      { id: 5, image: "card-small (5).png", points: 2, customPoints: false, timeMinutes: 8 },
      { id: 6, image: "card-small (6).png", points: 4, customPoints: false, timeMinutes: 20 },
      { id: 7, image: "card-small (7).png", points: 1000, customPoints: false, timeMinutes: 3 },
      { id: 8, image: "card-small (8).png", points: 2, customPoints: false, timeMinutes: 11 },
      { id: 9, image: "card-small (9).png", points: 2, customPoints: false, timeMinutes: 22 },
      { id: 10, image: "card-small (10).png", points: 2, customPoints: true, timeMinutes: 16 },
      { id: 11, image: "card-small (11).png", points: 20, customPoints: false, timeMinutes: 25 },
      { id: 12, image: "card-small (12).png", points: 1, customPoints: false, timeMinutes: 6 },
      { id: 13, image: "card-small (13).png", points: 2, customPoints: true, timeMinutes: 30 },
      { id: 14, image: "card-small (14).png", points: 1, customPoints: true, timeMinutes: 22 },
      { id: 15, image: "card-small (15).png", points: 3, customPoints: false, timeMinutes: 18 },
      { id: 16, image: "card-small (16).png", points: 10, customPoints: false, timeMinutes: 19 },
      { id: 17, image: "card-small (17).png", points: 5, customPoints: false, timeMinutes: 25 },
      { id: 18, image: "card-small (18).png", points: 7, customPoints: false, timeMinutes: 40 },
      { id: 19, image: "card-small (19).png", points: 5, customPoints: false, timeMinutes: 26 },
      { id: 20, image: "card-small (20).png", points: 3, customPoints: false, timeMinutes: 15 },
      { id: 21, image: "card-small (21).png", points: 3, customPoints: false, timeMinutes: 22 },
      { id: 22, image: "card-small (22).png", points: 3, customPoints: false, timeMinutes: 20 },
      { id: 23, image: "card-small (23).png", points: 7, customPoints: false, timeMinutes: 34 },
      { id: 24, image: "card-small (24).png", points: 3, customPoints: false, timeMinutes: 24 },
      { id: 25, image: "card-small (25).png", points: 1, customPoints: false, timeMinutes: 16 },
      { id: 26, image: "card-small (26).png", points: 4, customPoints: false, timeMinutes: 19 },
      { id: 27, image: "card-small (27).png", points: 2, customPoints: false, timeMinutes: 18 },
      { id: 28, image: "card-small (28).png", points: 5, customPoints: false, timeMinutes: 26 },
      { id: 29, image: "card-small (29).png", points: 1, customPoints: true, timeMinutes: 29 },
      { id: 30, image: "card-small (30).png", points: 5, customPoints: false, timeMinutes: 9 },
      { id: 31, image: "card-small (31).png", points: 5, customPoints: false, timeMinutes: 16 },
      { id: 32, image: "card-small (32).png", points: 5, customPoints: false, timeMinutes: 23 },
      { id: 33, image: "card-small (33).png", points: 3, customPoints: false, timeMinutes: 26 },
      { id: 34, image: "card-small (34).png", points: 5, customPoints: false, timeMinutes: 18 },
      { id: 35, image: "card-small (35).png", points: 5, customPoints: false, timeMinutes: 25 },
      { id: 36, image: "card-small (36).png", points: 4, customPoints: false, timeMinutes: 23 },
      { id: 37, image: "card-small (37).png", points: 4, customPoints: true, timeMinutes: 37 },
      { id: 38, image: "card-small (38).png", points: 3, customPoints: true, timeMinutes: 26 },
      { id: 39, image: "card-small (38).png", points: 5, customPoints: false, timeMinutes: 7 },
    ];
    const byId = Object.fromEntries(tasks.map((task) => [task.id, task]));
    const $ = (id) => document.getElementById(id);
    const board = $("board"), scoreValue = $("scoreValue"), nameInput = $("playerNameInput");
    const modal = $("confirmModal"), customWrap = $("customPointsWrap"), customInput = $("customPointsInput");
    let sharedState = null, pendingTaskId = null, toastTimer;

    function playerName() { return (nameInput.value || "Spieler").trim().slice(0, 22) || "Spieler"; }
    function playerKey() { return playerName().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "spieler"; }
    function toast(message) { const el = $("toast"); el.textContent = message; el.style.opacity = "1"; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = "0", 2200); }
    function formatTimer(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2,"0")}:${String(s % 60).padStart(2,"0")}`; }
    function makeActiveTask(id) { const task = byId[id]; return { deadline: Date.now() + task.timeMinutes * 60000, points: task.points, customPoints: task.customPoints, completionCount: 0, completedBy: {} }; }
    function shuffledIds() { return tasks.map((task) => task.id).sort(() => Math.random() - 0.5); }
    function makeNewState() {
      const ids = shuffledIds(), activeTasks = {};
      ids.splice(0, INITIAL_TASK_COUNT).forEach((id) => activeTasks[id] = makeActiveTask(id));
      return { catalogVersion: CATALOG_VERSION, activeTasks, remainingTaskIds: ids, playerScores: {}, eventLog: [], startedAt: Date.now(), finished: false };
    }
    function normalizeState(state) {
      if (!state || typeof state !== "object") return null;
      return { ...state, activeTasks: state.activeTasks || {}, remainingTaskIds: Array.isArray(state.remainingTaskIds) ? state.remainingTaskIds : [], playerScores: state.playerScores || {}, eventLog: Array.isArray(state.eventLog) ? state.eventLog : [], finished: Boolean(state.finished) };
    }
    function renderLeaderboard(data) {
      const entries = Object.values(data || {}).filter((entry) => entry && typeof entry.score === "number").sort((a,b) => b.score-a.score).slice(0,5);
      const list = $("leaderboardList"); list.replaceChildren();
      for (const [i, entry] of entries.entries()) { const li = document.createElement("li"); li.className = "leaderboard-item"; const name = document.createElement("span"); name.className = "leaderboard-name"; name.textContent = `${i+1}. ${entry.name || "Spieler"} `; const score = document.createElement("span"); score.className = "leaderboard-score"; score.textContent = `${entry.score} P`; li.append(name, score); list.append(li); }
      if (!entries.length) list.innerHTML = '<li class="empty-message">Noch keine Einträge.</li>';
    }
    function renderGamelog(events) {
      const list = $("gamelogList"); list.replaceChildren();
      [...(events || [])].reverse().forEach((event) => {
        const li = document.createElement("li"); li.className = "gamelog-entry";
        const detail = document.createElement("span"); detail.textContent = `${event.team || "Spieler"} hat Aufgabe #${event.taskId} gelöst: +${event.points} Punkte`;
        const time = document.createElement("time"); time.className = "gamelog-time"; time.textContent = event.timestamp ? new Date(event.timestamp).toLocaleString("de-DE") : "";
        li.append(detail, time); list.append(li);
      });
      if (!events?.length) list.innerHTML = '<li class="empty-message">Noch keine gelösten Aufgaben.</li>';
    }
    function renderBoard() {
      const state = normalizeState(sharedState);
      if (!state) { board.replaceChildren(); scoreValue.textContent = "0"; renderGamelog([]); return; }
      const key = playerKey(), score = Number(state.playerScores[key] || 0);
      scoreValue.textContent = String(score);
      const active = Object.entries(state.activeTasks).filter(([id]) => byId[id]).map(([id,task]) => ({...byId[id],...task,id:Number(id)}));
      board.replaceChildren();
      if (!active.length && !state.finished) { const empty = document.createElement("p"); empty.className = "empty-message"; empty.textContent = "Keine aktiven Aufgaben."; board.append(empty); }
      for (const task of active) {
        const remaining = Math.max(0, task.deadline - Date.now()), count = Number(task.completionCount || 0), done = Boolean(task.completedBy?.[key]);
        const card = document.createElement("article"); card.className = "task-card";
        const imageWrap = document.createElement("div"); imageWrap.className = "card-image-wrap";
        const image = document.createElement("img"); image.src = `images/${encodeURIComponent(task.image)}`; image.alt = `Aufgabe ${task.id}`; imageWrap.append(image);
        const body = document.createElement("div"); body.className = "task-body";
        const meta = document.createElement("div"); meta.className = "task-meta";
        const idLabel = document.createElement("span"); idLabel.className = "task-id"; idLabel.textContent = `Aufgabe #${task.id}`;
        const timer = document.createElement("span"); timer.className = `task-timer ${remaining <= 30000 ? "danger" : remaining <= 60000 ? "warning" : ""}`; timer.textContent = formatTimer(remaining); meta.append(idLabel, timer);
        const points = document.createElement("p"); points.className = "task-points"; points.textContent = task.customPoints ? "Eigene Punkte" : `${task.points} Punkte${count > 0 ? " für weitere Teams" : ""}`;
        const button = document.createElement("button"); button.className = "task-button"; button.dataset.taskId = String(task.id); button.disabled = done || remaining <= 0; button.textContent = done ? "Von dir erledigt" : count > 0 ? "Auch erledigt" : "Aufgabe erledigt";
        body.append(meta, points, button); card.append(imageWrap, body); board.append(card);
      }
      if (state.finished) { $("finishScreen").classList.add("show"); $("finishSummary").textContent = `${playerName()}, du hast insgesamt ${score} Punkte gesammelt.`; }
      else $("finishScreen").classList.remove("show");
      renderGamelog(state.eventLog);
    }
    async function initializeGame() {
      try {
        await runTransaction(GAME_REF, (current) => {
          if (!current) return makeNewState();
          if (current.catalogVersion === CATALOG_VERSION) return current;
          const state = normalizeState(current);
          const activeEntries = Object.entries(state.activeTasks).filter(([id]) => byId[id]);
          while (activeEntries.length > INITIAL_TASK_COUNT) { const [id] = activeEntries.pop(); delete state.activeTasks[id]; if (!state.remainingTaskIds.includes(Number(id))) state.remainingTaskIds.unshift(Number(id)); }
          state.catalogVersion = CATALOG_VERSION;
          if (!state.eventLog) state.eventLog = [];
          return state;
        });
      } catch { toast("Spielstand konnte nicht geladen werden. Firebase-Regeln prüfen."); }
    }
    function openConfirm(id) {
      const task = normalizeState(sharedState)?.activeTasks?.[id];
      if (!task || task.completedBy?.[playerKey()] || task.deadline <= Date.now()) return;
      pendingTaskId = Number(id);
      const custom = Boolean(task.customPoints);
      $("confirmText").textContent = custom ? "Trage die Punkte für dein Team ein." : `Du bekommst ${task.points} Punkte.`;
      customWrap.classList.toggle("show", custom);
      customInput.value = String(task.points);
      modal.classList.add("show");
    }
    function closeConfirm() { pendingTaskId = null; modal.classList.remove("show"); }
    async function completeTask() {
      if (pendingTaskId === null) return;
      const id = pendingTaskId, key = playerKey(), name = playerName(), localTask = normalizeState(sharedState)?.activeTasks?.[id];
      const entered = Number(customInput.value);
      if (localTask?.customPoints && (!Number.isFinite(entered) || entered < 0)) { toast("Bitte gültige Punkte eingeben."); return; }
      closeConfirm(); let awarded = 0;
      try {
        const result = await runTransaction(GAME_REF, (current) => {
          const state = normalizeState(current), task = state?.activeTasks?.[id];
          if (!state || !task || task.deadline <= Date.now() || task.completedBy?.[key]) return;
          const first = Number(task.completionCount || 0) === 0;
          awarded = task.customPoints ? entered : Number(task.points);
          task.completionCount = Number(task.completionCount || 0) + 1;
          task.completedBy = { ...(task.completedBy || {}), [key]: true };
          if (first) {
            task.deadline = Date.now() + SECOND_PLAYER_TIME_MS;
            if (!task.customPoints) task.points = Math.ceil(awarded / 2);
            const nextId = state.remainingTaskIds.shift();
            if (nextId !== undefined && byId[nextId]) state.activeTasks[nextId] = makeActiveTask(nextId);
          }
          state.playerScores[key] = Number(state.playerScores[key] || 0) + awarded;
          state.eventLog.push({ team: name, taskId: id, points: awarded, timestamp: Date.now() });
          return state;
        }, { applyLocally: false });
        if (!result.committed) { toast("Aufgabe ist abgelaufen oder bereits erledigt."); return; }
        const savedState = result.snapshot.val();
        await set(ref(db, `leaderboard/${key}`), { name, score: Number(savedState?.playerScores?.[key] || 0), updatedAt: Date.now() });
        toast(`Aufgabe erledigt! +${awarded} Punkte`);
      } catch { toast("Erledigung konnte nicht gespeichert werden."); }
    }
    async function advanceExpiredTasks() {
      try {
        await runTransaction(GAME_REF, (current) => {
          const state = normalizeState(current);
          if (!state || state.catalogVersion !== CATALOG_VERSION || state.finished) return;
          const now = Date.now();
          for (const [id, task] of Object.entries(state.activeTasks)) if (Number(task.deadline) <= now) delete state.activeTasks[id];
          while (Object.keys(state.activeTasks).length < BOARD_TARGET_COUNT && state.remainingTaskIds.length) {
            const id = state.remainingTaskIds.shift(); if (byId[id]) state.activeTasks[id] = makeActiveTask(id);
          }
          if (!Object.keys(state.activeTasks).length && !state.remainingTaskIds.length) state.finished = true;
          return state;
        }, { applyLocally: false });
      } catch {}
    }
    async function newGame() {
      if (!window.confirm("Ein neues gemeinsames Spiel starten? Der aktuelle Spielstand wird zurückgesetzt.")) return;
      try { await runTransaction(GAME_REF, () => makeNewState(), { applyLocally: false }); toast("Neues Spiel gestartet."); }
      catch { toast("Neues Spiel konnte nicht gestartet werden."); }
    }
    $("playerNameInput").value = localStorage.getItem("regenspurge-player-name") || "Spieler";
    $("playerNameConfirmBtn").addEventListener("click", () => { localStorage.setItem("regenspurge-player-name", playerName()); renderBoard(); toast(`Spielername gespeichert: ${playerName()}`); });
    nameInput.addEventListener("input", renderBoard);
    board.addEventListener("click", (event) => { const button = event.target.closest("[data-task-id]"); if (button && !button.disabled) openConfirm(button.dataset.taskId); });
    $("cancelConfirmBtn").addEventListener("click", closeConfirm);
    $("confirmBtn").addEventListener("click", completeTask);
    $("newGameBtn").addEventListener("click", newGame);
    $("resetAllBtn").addEventListener("click", async () => {
      if (!window.confirm("Spielstand und Bestenliste für alle löschen?")) return;
      if (!window.confirm("Wirklich endgültig löschen? Dieser Schritt kann nicht rückgängig gemacht werden.")) return;
      try {
        await Promise.all([runTransaction(GAME_REF, () => makeNewState(), { applyLocally: false }), set(ref(db, "leaderboard"), null)]);
        toast("Spielstand und Bestenliste wurden gelöscht.");
      } catch { toast("Daten konnten nicht gelöscht werden."); }
    });
    onValue(GAME_REF, (snapshot) => { sharedState = snapshot.val(); if (!sharedState || sharedState.catalogVersion !== CATALOG_VERSION) initializeGame(); renderBoard(); });
    onValue(ref(db,"leaderboard"), (snapshot) => renderLeaderboard(snapshot.val() || {}), () => renderLeaderboard({}));
    initializeGame();
    setInterval(async () => { await advanceExpiredTasks(); renderBoard(); }, 1000);
  </script>
</body>
</html>
