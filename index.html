<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RegensPurge</title>
<style>
:root {
--bg-dark: #1b1a17;
--bg-panel: rgba(63, 49, 37, 0.76);
--bg-panel-strong: rgba(45, 35, 29, 0.9);
--card: rgba(250, 244, 232, 0.9);
--card-border: rgba(92, 69, 50, 0.28);
--primary: #d7b36a;
--primary-strong: #b98245;
--secondary: #d69871;
--accent: #8ea86f;
--success: #5d7f5a;
--danger: #b8675d;
--text: #fffaf2;
--muted: #f4e4c8;
--shadow: 0 18px 34px rgba(24, 18, 12, 0.28);
--gold-soft: #f5d58f;
--wood: #4e3828;
}

* {
box-sizing: border-box;
}

html, body {
margin: 0;
min-height: 100%;
font-family: Arial, Helvetica, sans-serif;
color: var(--text);
background-color: var(--bg-dark);
}

body {
min-height: 100vh;
background-image: url("Wallpaper/Regensburg_Alte_Bruecke_mit_Altstadt.jpg");
background-size: cover;
background-position: center;
background-attachment: fixed;
}

.page-overlay {
position: fixed;
inset: 0;
background: linear-gradient(135deg, rgba(24, 18, 15, 0.7), rgba(39, 30, 24, 0.55));
z-index: 0;
}

.app {
position: relative;
z-index: 1;
width: min(1200px, calc(100% - 24px));
margin: 0 auto;
padding: 20px 0 40px;
}

.topbar {
display: flex;
justify-content: space-between;
align-items: center;
gap: 16px;
background: rgba(57, 44, 33, 0.72);
backdrop-filter: blur(8px);
border: 1px solid rgba(255, 243, 222, 0.12);
border-radius: 24px;
padding: 18px 22px;
box-shadow: var(--shadow);
}

.title-wrap {
display: flex;
flex-direction: column;
gap: 6px;
}

.title {
font-size: clamp(2rem, 3vw, 3rem);
font-weight: 900;
letter-spacing: 0.08em;
text-transform: uppercase;
margin: 0;
color: var(--gold-soft);
text-shadow: 0 6px 18px rgba(24, 18, 12, 0.28);
}

.subtitle {
margin: 0;
font-size: 0.82rem;
letter-spacing: 0.08em;
text-transform: uppercase;
color: var(--muted);
}

.player-panel {
display: flex;
align-items: center;
gap: 14px;
flex-wrap: wrap;
}

.player-input-wrap {
display: flex;
flex-direction: column;
gap: 8px;
color: var(--muted);
font-size: 0.75rem;
text-transform: uppercase;
letter-spacing: 0.08em;
}

.player-input-wrap input {
border: 1px solid rgba(255, 248, 236, 0.18);
background: rgba(40, 31, 26, 0.8);
color: var(--text);
border-radius: 14px;
padding: 12px 14px;
font-size: 1rem;
min-width: 220px;
outline: none;
}

.score-box {
min-width: 150px;
background: linear-gradient(135deg, rgba(214, 152, 113, 0.22), rgba(164, 122, 82, 0.22));
border: 1px solid rgba(214, 152, 113, 0.35);
border-radius: 18px;
padding: 10px 16px;
text-align: center;
}

.score-label {
display: block;
color: var(--muted);
font-size: 0.72rem;
letter-spacing: 0.08em;
text-transform: uppercase;
}

.score-value {
font-size: clamp(1.8rem, 2vw, 2.4rem);
font-weight: 900;
}

      .leaderboard-panel {
        margin-top: 18px;
        background: rgba(57, 44, 33, 0.72);
        border: 1px solid rgba(255, 243, 222, 0.12);
        border-radius: 24px;
        padding: 18px 20px;
        box-shadow: var(--shadow);
      }

      .leaderboard-title {
        margin: 0 0 12px;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .leaderboard-list {
        list-style: none;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
        padding: 0;
        margin: 0;
      }

      .leaderboard-item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 14px;
        padding: 10px 12px;
        border: 1px solid rgba(255, 243, 222, 0.08);
      }

      .leaderboard-name {
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .leaderboard-score {
        color: var(--gold-soft);
        font-weight: 900;
      }

.board {
display: grid;
grid-template-columns: repeat(3, minmax(240px, 1fr));
gap: 22px;
margin-top: 24px;
}

.task-card {
position: relative;
display: flex;
flex-direction: column;
min-height: 540px;
background: linear-gradient(180deg, rgba(245, 233, 214, 0.96), rgba(234, 222, 202, 0.94));
color: #2e1f16;
border: 1px solid rgba(89, 66, 49, 0.2);
border-radius: 24px;
overflow: hidden;
box-shadow: var(--shadow);
transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.task-card:hover {
transform: translateY(-4px);
box-shadow: 0 26px 40px rgba(24, 18, 12, 0.22);
}

.task-card.expired {
border-color: rgba(184, 103, 93, 0.35);
box-shadow: 0 0 0 1px rgba(184, 103, 93, 0.2), var(--shadow);
}

.card-image-wrap {
position: relative;
width: 100%;
aspect-ratio: 1 / 1.5;
background: rgba(255, 255, 255, 0.18);
border-bottom: 1px solid rgba(79, 58, 43, 0.18);
overflow: hidden;
}

.card-image-wrap img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}

.task-body {
display: flex;
flex: 1;
flex-direction: column;
padding: 18px 18px 16px;
}

.task-title {
margin: 0 0 10px;
font-size: 1.35rem;
font-weight: 800;
}

.task-meta {
display: flex;
justify-content: space-between;
align-items: center;
gap: 12px;
margin-bottom: 16px;
}

.badge {
display: inline-flex;
align-items: center;
justify-content: center;
padding: 7px 12px;
background: rgba(162, 128, 82, 0.14);
color: #4d3528;
border: 1px solid rgba(162, 128, 82, 0.28);
border-radius: 999px;
font-weight: 700;
font-size: 0.8rem;
}

.timer {
color: #5e4738;
font-weight: 800;
font-size: 0.96rem;
text-align: right;
}

.timer.warning {
color: #a46a3d;
}

.timer.danger {
color: #b54b42;
}

.task-button {
margin-top: auto;
width: 100%;
border: none;
border-radius: 14px;
padding: 16px 18px;
background: linear-gradient(135deg, var(--primary), var(--primary-strong));
color: #fffaf2;
font-weight: 900;
font-size: 1rem;
cursor: pointer;
letter-spacing: 0.05em;
text-transform: uppercase;
transition: filter 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
box-shadow: 0 10px 18px rgba(146, 96, 42, 0.2);
}

.task-button:hover {
filter: brightness(1.03);
transform: translateY(-1px);
}

.task-button:active {
transform: translateY(0);
}

.task-card.expired .task-button {
background: linear-gradient(135deg, #c77b72, #ac5b51);
box-shadow: 0 10px 18px rgba(150, 81, 68, 0.18);
color: #fffaf4;
}

.modal {
position: fixed;
inset: 0;
display: none;
align-items: center;
justify-content: center;
background: rgba(26, 20, 17, 0.64);
z-index: 20;
}

.modal.show {
display: flex;
}

.modal-card {
width: min(420px, calc(100% - 28px));
background: linear-gradient(180deg, rgba(61, 46, 36, 0.96), rgba(46, 34, 28, 0.96));
border: 1px solid rgba(255, 243, 222, 0.12);
border-radius: 22px;
box-shadow: var(--shadow);
padding: 22px 20px 18px;
}

.modal-card h3 {
margin: 0 0 10px;
font-size: 1.55rem;
color: #fff4df;
}

.modal-card p {
margin: 0 0 16px;
color: var(--muted);
line-height: 1.5;
}

.custom-points {
display: none;
margin-bottom: 16px;
}

.custom-points.show {
display: block;
}

.custom-points label {
display: flex;
flex-direction: column;
gap: 8px;
color: var(--muted);
font-size: 0.8rem;
letter-spacing: 0.08em;
text-transform: uppercase;
}

.custom-points input {
border: 1px solid rgba(255, 248, 236, 0.18);
background: rgba(31, 24, 20, 0.8);
color: var(--text);
border-radius: 12px;
padding: 12px 14px;
font-size: 1rem;
}

.modal-actions {
display: flex;
justify-content: flex-end;
gap: 10px;
}

.secondary-btn,
.primary-btn,
.restart-btn {
border: none;
border-radius: 12px;
padding: 12px 18px;
font-weight: 800;
cursor: pointer;
text-transform: uppercase;
letter-spacing: 0.05em;
}

.secondary-btn {
background: rgba(255, 255, 255, 0.08);
color: var(--text);
}

.primary-btn,
.restart-btn {
background: linear-gradient(135deg, var(--primary), var(--primary-strong));
color: #fffaf2;
}

.toast {
position: fixed;
left: 50%;
bottom: 28px;
transform: translateX(-50%) translateY(20px);
background: rgba(36, 28, 23, 0.96);
border: 1px solid rgba(255, 243, 222, 0.12);
color: var(--text);
border-radius: 999px;
padding: 12px 20px;
font-weight: 700;
box-shadow: var(--shadow);
opacity: 0;
pointer-events: none;
transition: opacity 0.2s ease, transform 0.2s ease;
z-index: 25;
}

.toast.show {
opacity: 1;
transform: translateX(-50%) translateY(0);
}

.finish-screen {
display: none;
margin-top: 24px;
background: rgba(56, 43, 35, 0.8);
border: 1px solid rgba(255, 243, 222, 0.12);
border-radius: 24px;
box-shadow: var(--shadow);
padding: 30px 22px;
text-align: center;
}

.finish-screen.show {
display: block;
}

.finish-screen h2 {
margin: 0 0 10px;
font-size: clamp(2rem, 3vw, 2.8rem);
color: #fff5dd;
}

.finish-screen p {
margin: 0 0 20px;
color: var(--muted);
font-size: 1.05rem;
}

.confetti-layer {
position: fixed;
inset: 0;
pointer-events: none;
overflow: hidden;
z-index: 50;
}

.confetti-piece {
position: absolute;
top: -20px;
width: 12px;
height: 20px;
border-radius: 3px;
opacity: 0.9;
animation: confetti-fall 4200ms ease-in forwards;
}

@keyframes confetti-fall {
0% {
transform: translate3d(0, 0, 0) rotateZ(0deg) scale(1);
opacity: 1;
}
100% {
transform: translate3d(var(--dx), 118vh, 0) rotateZ(720deg) scale(0.8);
opacity: 0;
}
}

@media (max-width: 900px) {
.board {
grid-template-columns: 1fr;
}

.topbar {
flex-direction: column;
align-items: flex-start;
}

.player-panel {
width: 100%;
justify-content: space-between;
}
}

@media (max-width: 560px) {
.app {
width: min(100% - 16px, 1200px);
padding-top: 12px;
}

.topbar {
padding: 16px;
}

.player-panel {
display: grid;
width: 100%;
grid-template-columns: 1fr;
}

.player-input-wrap input {
min-width: 0;
width: 100%;
}
}
</style>
</head>
<body>
<div class="page-overlay"></div>

<div class="app">
<header class="topbar">
<div class="title-wrap">
<h1 class="title">RegensPurge</h1>
          <p class="subtitle">Missionen, Punkte & Abenteuer</p>
</div>

<div class="player-panel">
<label class="player-input-wrap">
Spielername
<input id="playerNameInput" type="text" value="Spieler" maxlength="22" />
</label>

<div class="score-box">
<span class="score-label">Punkte</span>
<span id="scoreValue" class="score-value">0</span>
</div>
</div>
</header>

      <section class="leaderboard-panel">
        <h2 class="leaderboard-title">Bestenliste</h2>
        <ol id="leaderboardList" class="leaderboard-list"></ol>
      </section>

<main id="board" class="board" aria-live="polite"></main>

<section id="finishScreen" class="finish-screen">
<h2>Runde beendet!</h2>
<p id="finishSummary">Du hast 0 Punkte gesammelt.</p>
<button id="newGameBtn" class="restart-btn" type="button">Neues Spiel</button>
</section>
</div>

<div id="confirmModal" class="modal" aria-modal="true" role="dialog">
<div class="modal-card">
<h3>Aufgabe erledigt?</h3>
<p id="confirmText">Bist du sicher?</p>

<div id="customPointsWrap" class="custom-points">
<label>
Punkte selbst eintragen
<input id="customPointsInput" type="number" min="0" step="5" value="0" />
</label>
</div>

<div class="modal-actions">
<button id="cancelConfirmBtn" class="secondary-btn" type="button">Abbrechen</button>
<button id="confirmBtn" class="primary-btn" type="button">Bestätigen</button>
</div>
</div>
</div>

<div id="toast" class="toast" aria-live="polite"></div>
<div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDXyTteMhe2rotr64TMQ6w5mGoUCTDDrrA",
        authDomain: "regenspurge.firebaseapp.com",
        databaseURL: "https://regenspurge-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "regenspurge",
        storageBucket: "regenspurge.firebasestorage.app",
        messagingSenderId: "706439523349",
        appId: "1:706439523349:web:0db0ac82a9241ee184321c",
        measurementId: "G-K758M4BMPZ"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

const tasks = [
{ id: 1, title: 'Stadt-Check', image: 'card-small(1).png', points: 20, customPoints: false },
{ id: 2, title: 'Kaffeepause', image: 'card-small (2).png', points: 25, customPoints: false },
{ id: 3, title: 'Blick auf die Donau', image: 'card-small (3).png', points: 30, customPoints: false },
{ id: 4, title: 'Altstadt-Abenteuer', image: 'card-small (4).png', points: 35, customPoints: false },
{ id: 5, title: 'Regensburger Snack', image: 'card-small (5).png', points: 40, customPoints: false },
{ id: 6, title: 'Foto-Highlight', image: 'card-small (6).png', points: 25, customPoints: false },
{ id: 7, title: 'Zusammen mit Freunden', image: 'card-small (7).png', points: 30, customPoints: false },
{ id: 8, title: 'Tour durch die Gassen', image: 'card-small (8).png', points: 20, customPoints: false },
{ id: 9, title: 'Mit dem Stadtbild feiern', image: 'card-small (9).png', points: 45, customPoints: false },
{ id: 10, title: 'Eigenes Punkteritual', image: 'card-small (10).png', points: 15, customPoints: true },
{ id: 11, title: 'Finale Überraschung', image: 'card-small (11).png', points: 50, customPoints: true }
];

const board = document.getElementById('board');
const scoreValue = document.getElementById('scoreValue');
const playerNameInput = document.getElementById('playerNameInput');
const confirmModal = document.getElementById('confirmModal');
const confirmText = document.getElementById('confirmText');
const customPointsWrap = document.getElementById('customPointsWrap');
const customPointsInput = document.getElementById('customPointsInput');
const toast = document.getElementById('toast');
const confettiLayer = document.getElementById('confettiLayer');
const finishScreen = document.getElementById('finishScreen');
const finishSummary = document.getElementById('finishSummary');
      const leaderboardList = document.getElementById('leaderboardList');

let remainingTasks = [];
let activeTasks = [];
let score = 0;
let pendingTaskId = null;
let gameStarted = false;

      function normalizePlayerName() {
        return (playerNameInput.value || 'Spieler').trim().slice(0, 22) || 'Spieler';
      }

      function makePlayerKey(name) {
        return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'spieler';
      }

      function saveScoreToFirebase() {
        const name = normalizePlayerName();
        const key = makePlayerKey(name);
        set(ref(db, `leaderboard/${key}`), {
          name,
          score,
          updatedAt: Date.now()
        }).catch(() => {
          // silently fail for local play if Firebase is unavailable
        });
      }

      function renderLeaderboard(entries) {
        if (!entries.length) {
          leaderboardList.innerHTML = '<li class="leaderboard-item"><span class="leaderboard-name">Noch keine Punkte</span><span class="leaderboard-score">0</span></li>';
          return;
        }

        leaderboardList.innerHTML = entries
          .slice(0, 5)
          .map((entry, index) => `
            <li class="leaderboard-item">
              <span class="leaderboard-name">${index + 1}. ${entry.name}</span>
              <span class="leaderboard-score">${entry.score}</span>
            </li>
          `)
          .join('');
      }

      function subscribeToLeaderboard() {
        const leaderboardRef = ref(db, 'leaderboard');
        onValue(leaderboardRef, (snapshot) => {
          const data = snapshot.val() || {};
          const entries = Object.values(data)
            .filter((entry) => entry && typeof entry.score === 'number')
            .sort((a, b) => b.score - a.score);
          renderLeaderboard(entries);
        }, () => {
          renderLeaderboard([]);
        });
      }

function shuffleArray(array) {
const copy = [...array];
for (let i = copy.length - 1; i > 0; i -= 1) {
const j = Math.floor(Math.random() * (i + 1));
[copy[i], copy[j]] = [copy[j], copy[i]];
}
return copy;
}

function formatTimer(ms) {
const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
const minutes = Math.floor(totalSeconds / 60);
const seconds = totalSeconds % 60;
return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

function getTaskImageUrl(fileName) {
return `images/${encodeURIComponent(fileName)}`;
}

function updateScore() {
scoreValue.textContent = String(score);
}

function showToast(message) {
toast.textContent = message;
toast.classList.add('show');
clearTimeout(showToast.timeoutId);
showToast.timeoutId = setTimeout(() => {
toast.classList.remove('show');
}, 1800);
}

function createConfettiBurst() {
const colors = ['#f0c75e', '#ef8a5b', '#c7d66d', '#8ab7d3', '#d889b6', '#7bbf9b', '#e3b0a8'];

for (let i = 0; i < 2200; i += 1) {
const piece = document.createElement('span');
piece.className = 'confetti-piece';
piece.style.left = `${Math.random() * 100}%`;
piece.style.background = colors[Math.floor(Math.random() * colors.length)];
piece.style.setProperty('--dx', `${(Math.random() - 0.5) * 900}px`);
confettiLayer.appendChild(piece);

setTimeout(() => {
piece.remove();
}, 5000);
}
}

function openConfirm(taskId) {
const selectedTask = activeTasks.find((task) => task.id === taskId);
if (!selectedTask || selectedTask.status !== 'active') return;

pendingTaskId = taskId;
confirmText.textContent = `"${selectedTask.title}" ist erledigt. ${selectedTask.customPoints ? 'Trage die Punkte selbst ein.' : `Du bekommst ${selectedTask.points} Punkte.`}`;

if (selectedTask.customPoints) {
customPointsWrap.classList.add('show');
customPointsInput.value = String(Math.max(0, selectedTask.points));
} else {
customPointsWrap.classList.remove('show');
}

confirmModal.classList.add('show');
}

function closeConfirm() {
pendingTaskId = null;
confirmModal.classList.remove('show');
}

function confirmTaskCompletion() {
if (pendingTaskId === null) return;

const task = activeTasks.find((entry) => entry.id === pendingTaskId);
if (!task) {
closeConfirm();
return;
}

let pointsToAward = task.points;

if (task.customPoints) {
const parsed = Number(customPointsInput.value);
if (!Number.isFinite(parsed) || parsed < 0) {
showToast('Bitte gültige Punkte eingeben.');
return;
}
pointsToAward = parsed;
}

task.status = 'done';
task.pointsAwarded = pointsToAward;
score += pointsToAward;
updateScore();
        saveScoreToFirebase();

createConfettiBurst();
showToast(`${task.title} abgeschlossen! +${pointsToAward} Punkte`);

activeTasks = activeTasks.filter((entry) => entry.id !== task.id);
closeConfirm();
refillBoard();
}

function expireTask(taskId) {
const task = activeTasks.find((entry) => entry.id === taskId);
if (!task || task.status !== 'active') return;

task.status = 'expired';
task.pointsAwarded = 0;
showToast(`${task.title} abgelaufen: 0 Punkte`);

activeTasks = activeTasks.filter((entry) => entry.id !== task.id);
refillBoard();
}

function refillBoard() {
while (activeTasks.length < 3 && remainingTasks.length > 0) {
const nextTask = remainingTasks.shift();
if (!nextTask) break;
nextTask.status = 'active';
nextTask.deadline = Date.now() + 15 * 60 * 1000;
activeTasks.push(nextTask);
}

renderBoard();

if (activeTasks.length === 0 && remainingTasks.length === 0 && gameStarted) {
finishScreen.classList.add('show');
          finishSummary.textContent = `${playerNameInput.value.trim() || 'Spieler'}, du hast insgesamt ${score} Punkte gesammelt.`;
          finishSummary.textContent = `${normalizePlayerName()}, du hast insgesamt ${score} Punkte gesammelt.`;
gameStarted = false;
          saveScoreToFirebase();
}
}

function renderBoard() {
board.innerHTML = activeTasks
.map((task) => {
const remainingMs = Math.max(0, task.deadline - Date.now());
const timeText = formatTimer(remainingMs);
const isWarning = remainingMs <= 60 * 1000 && remainingMs > 30 * 1000;
const isDanger = remainingMs <= 30 * 1000;

return `
             <article class="task-card ${task.status === 'expired' ? 'expired' : ''}" data-id="${task.id}">
               <div class="card-image-wrap">
                 <img src="${getTaskImageUrl(task.image)}" alt="${task.title}" />
               </div>

               <div class="task-body">
                 <h2 class="task-title">${task.title}</h2>

                 <div class="task-meta">
                   <span class="badge">${task.customPoints ? 'Eigenpunkte' : `${task.points} P`}</span>
                   <span class="timer ${isWarning ? 'warning' : ''} ${isDanger ? 'danger' : ''}">${timeText}</span>
                 </div>

                 <button class="task-button" type="button" data-task-id="${task.id}">Aufgabe erledigt</button>
               </div>
             </article>
           `;
})
.join('');
}

function startGame() {
score = 0;
updateScore();
remainingTasks = shuffleArray(tasks);
activeTasks = [];
gameStarted = true;
finishScreen.classList.remove('show');

refillBoard();
}

function tickTimers() {
if (!gameStarted) return;

activeTasks.forEach((task) => {
if (task.status !== 'active') return;
if (task.deadline - Date.now() <= 0) {
expireTask(task.id);
}
});

renderBoard();
}

playerNameInput.addEventListener('input', () => {
        if (!gameStarted) return;
        const safeName = normalizePlayerName();
document.title = `${safeName} | RegensPurge`;
        if (gameStarted) {
          saveScoreToFirebase();
        }
});

board.addEventListener('click', (event) => {
const button = event.target.closest('[data-task-id]');
if (!button) return;
const taskId = Number(button.dataset.taskId);
openConfirm(taskId);
});

document.getElementById('cancelConfirmBtn').addEventListener('click', closeConfirm);
document.getElementById('confirmBtn').addEventListener('click', confirmTaskCompletion);
document.getElementById('newGameBtn').addEventListener('click', startGame);

document.addEventListener('keydown', (event) => {
if (event.key === 'Escape' && confirmModal.classList.contains('show')) {
closeConfirm();
}
});

      subscribeToLeaderboard();
startGame();
setInterval(tickTimers, 1000);
</script>
</body>
</html>
