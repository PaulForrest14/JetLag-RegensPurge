<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aufgaben-Spiel</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 20px;
    min-height: 100vh;
    background-image: linear-gradient(rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.72)),
        url("Wallpaper/Regensburg_Alte_Bruecke_mit_Altstadt.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

h1, h2 {
    text-align: center;
}

#playerArea {
    text-align: center;
    margin-bottom: 20px;
}

#playerArea input {
    padding: 10px;
    font-size: 16px;
}

#playerArea button {
    padding: 10px 15px;
    cursor: pointer;
}

#scoreBoard {
    background: white;
    padding: 15px;
    border-radius: 10px;
    max-width: 500px;
    margin: 0 auto 25px auto;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.score {
    font-size: 22px;
    font-weight: bold;
}

#gameArea {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    width: 200px;
    margin: 0 auto;
}

.card img {
    display: block;
    width: 200px;
    height: 300px;
    object-fit: cover;
    cursor: pointer;
}

.card button {
    width: 100%;
    border: none;
    padding: 15px;
    font-size: 18px;
    background: #28a745;
    color: white;
    cursor: pointer;
}

.card button:hover {
    background: #218838;
}

#leaderboard {
    max-width: 500px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

#leaderboard ul {
    list-style: none;
    padding: 0;
}

#leaderboard li {
    padding: 8px;
    border-bottom: 1px solid #ddd;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-content {
    position: relative;
    max-width: 90vw;
    max-height: 90vh;
    background: white;
    border-radius: 12px;
    padding: 10px;
}

.modal-content img {
    display: block;
    max-width: 90vw;
    max-height: 80vh;
    object-fit: contain;
    border-radius: 8px;
}

.close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    color: white;
    font-size: 42px;
    font-weight: bold;
    cursor: pointer;
    line-height: 1;
}
</style>

</head>
<body>

<h1>🎮 Aufgaben-Spiel</h1>

<div id="playerArea">
    <input
        type="text"
        id="playerName"
        placeholder="Spielername">

    <button onclick="selectPlayer()">
        Spieler starten
    </button>
</div>

<div id="scoreBoard">
    <div>
        Spieler:
        <strong id="activePlayer">-</strong>
    </div>

    <div class="score">
        Punkte:
        <span id="score">0</span>
    </div>

    <div>
        Highscore:
        <span id="highscore">0</span>
    </div>

    <br>

    <button onclick="resetScore()">
        Punktestand zurücksetzen
    </button>
</div>

<div id="gameArea"></div>

<div id="leaderboard">
    <h2>🏆 Bestenliste</h2>
    <ul id="leaderboardList"></ul>
</div>

<div id="imageModal" class="modal" onclick="closeImageModal()">
    <span class="close-btn" onclick="closeImageModal()">&times;</span>
    <div class="modal-content" onclick="event.stopPropagation()">
        <img id="modalImage" src="" alt="Vergrößerte Aufgabe">
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>

const tasks = [
    { image: "images/card-small (1).png", points: 5, customPoints: true },
    { image: "images/card-small (2).png", points: 10, customPoints: true },
    { image: "images/card-small (3).png", points: 15, customPoints: true },
    { image: "images/card-small (4).png", points: 20, customPoints: true },
    { image: "images/card-small (5).png", points: 25, customPoints: true },
    { image: "images/card-small (6).png", points: 30 },
    { image: "images/card-small (7).png", points: 35 },
    { image: "images/card-small (8).png", points: 40 },
    { image: "images/card-small (9).png", points: 45 },
    { image: "images/card-small (10).png", points: 50 },
    { image: "images/card-small (11).png", points: 55 }
];

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};

const isFirebaseConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db = null;
let gameRef = null;

if (isFirebaseConfigured) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    gameRef = db.ref("jetlag-regenspurge");
}

let players = {};
let currentPlayer = "";
let activeImages = [];

function getLocalState() {
    try {
        return JSON.parse(localStorage.getItem("jetlag-regenspurge")) || {};
    } catch (error) {
        return {};
    }
}

function saveLocalState() {
    localStorage.setItem("jetlag-regenspurge", JSON.stringify({
        players,
        activeImages
    }));
}

function persistState() {
    if (gameRef) {
        gameRef.set({ players, activeImages });
        return;
    }

    saveLocalState();
}

function initializeSharedState() {
    if (gameRef) {
        gameRef.on("value", (snapshot) => {
            const data = snapshot.val() || {};
            players = data.players || {};
            activeImages = data.activeImages || [];

            if (activeImages.length === 0) {
                initializeGame();
                return;
            }

            updatePlayerDisplay();
            render();
            updateLeaderboard();
        });
        return;
    }

    const saved = getLocalState();
    players = saved.players || {};
    activeImages = saved.activeImages || [];

    if (activeImages.length === 0) {
        initializeGame();
    } else {
        render();
    }

    updateLeaderboard();
}

function selectPlayer() {
    const name = document.getElementById("playerName").value.trim();

    if (name === "") {
        alert("Bitte Spielernamen eingeben.");
        return;
    }

    currentPlayer = name;

    if (!players[name]) {
        players[name] = { score: 0, highscore: 0 };
        persistState();
    }

    updatePlayerDisplay();

    if (activeImages.length === 0) {
        initializeGame();
    }
}

function updatePlayerDisplay() {
    if (!currentPlayer) return;

    document.getElementById("activePlayer").textContent = currentPlayer;
    document.getElementById("score").textContent = players[currentPlayer]?.score ?? 0;
    document.getElementById("highscore").textContent = players[currentPlayer]?.highscore ?? 0;

    updateLeaderboard();
}

function updateLeaderboard() {
    const list = document.getElementById("leaderboardList");
    list.innerHTML = "";

    const ranking = Object.entries(players).sort((a, b) => b[1].highscore - a[1].highscore);

    ranking.forEach(([name, data]) => {
        const li = document.createElement("li");
        li.textContent = `${name}: ${data.highscore} Punkte`;
        list.appendChild(li);
    });
}

function updateScore(points) {
    if (!currentPlayer) {
        alert("Bitte zuerst einen Spieler auswählen.");
        return;
    }

    if (!players[currentPlayer]) {
        players[currentPlayer] = { score: 0, highscore: 0 };
    }

    players[currentPlayer].score += points;

    if (players[currentPlayer].score > players[currentPlayer].highscore) {
        players[currentPlayer].highscore = players[currentPlayer].score;
    }

    persistState();
    updatePlayerDisplay();
}

function resetScore() {
    if (!currentPlayer) return;

    if (!players[currentPlayer]) {
        players[currentPlayer] = { score: 0, highscore: 0 };
    }

    players[currentPlayer].score = 0;
    persistState();
    updatePlayerDisplay();
}

function getRandomTask() {
    const available = tasks.filter(task => !activeImages.some(active => active.image === task.image));

    if (available.length === 0) {
        return null;
    }

    return available[Math.floor(Math.random() * available.length)];
}

function initializeGame() {
    activeImages = [];

    for (let i = 0; i < 3; i++) {
        const task = getRandomTask();
        if (task) {
            activeImages.push(task);
        }
    }

    persistState();
    render();
}

function openImageModal(imageSrc) {
    const modal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");
    modalImage.src = imageSrc;
    modal.classList.add("show");
}

function closeImageModal() {
    const modal = document.getElementById("imageModal");
    modal.classList.remove("show");
    document.getElementById("modalImage").src = "";
}

function getCustomTaskPoints(task) {
    const input = window.prompt(`Punkte für Aufgabe eingeben:`, String(task.points));

    if (input === null) {
        return null;
    }

    const points = Number.parseInt(input, 10);

    if (!Number.isFinite(points) || points < 0) {
        alert("Bitte eine gültige Zahl eingeben.");
        return null;
    }

    return points;
}

function completeTask(index) {
    if (!currentPlayer) {
        alert("Bitte zuerst einen Spieler auswählen.");
        return;
    }

    const task = activeImages[index];
    if (!task) {
        return;
    }

    const points = task.customPoints ? getCustomTaskPoints(task) : task.points;
    if (points === null) {
        return;
    }

    updateScore(points);

    activeImages.splice(index, 1);

    const nextTask = getRandomTask();
    if (nextTask) {
        activeImages.push(nextTask);
    }

    persistState();
    render();
}

function render() {
    const gameArea = document.getElementById("gameArea");
    gameArea.innerHTML = "";

    activeImages.forEach((task, index) => {
        const card = document.createElement("div");
        card.classList.add("card");

        const buttonText = task.customPoints
            ? "✅ Erledigt (Punkte eingeben)"
            : `✅ Erledigt (+${task.points} Punkte)`;

        card.innerHTML = `
            <img src="${task.image}" alt="Aufgabe" onclick="openImageModal('${task.image}')">
            <button onclick="completeTask(${index})">
                ${buttonText}
            </button>
        `;

        gameArea.appendChild(card);
    });
}

initializeSharedState();
updateLeaderboard();
</script>

</body>
</html>
