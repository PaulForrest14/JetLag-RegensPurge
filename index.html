<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aufgaben-Spiel</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 20px;
    min-height: 100vh;
    background-image: linear-gradient(rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.72)),
        url("Wallpaper/Regensburg_Alte_Bruecke_mit_Altstadt.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

h1, h2 {
    text-align: center;
}

#playerArea {
    text-align: center;
    margin-bottom: 20px;
}

#playerArea input {
    padding: 10px;
    font-size: 16px;
}

#playerArea button {
    padding: 10px 15px;
    cursor: pointer;
}

#scoreBoard {
    background: white;
    padding: 15px;
    border-radius: 10px;
    max-width: 500px;
    margin: 0 auto 25px auto;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.score {
    font-size: 22px;
    font-weight: bold;
}

#gameArea {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    width: 200px;
    margin: 0 auto;
}

.card img {
    display: block;
    width: 200px;
    height: 300px;
    object-fit: cover;
}

.card button {
    width: 100%;
    border: none;
    padding: 15px;
    font-size: 18px;
    background: #28a745;
    color: white;
    cursor: pointer;
}

.card button:hover {
    background: #218838;
}

#leaderboard {
    max-width: 500px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

#leaderboard ul {
    list-style: none;
    padding: 0;
}

#leaderboard li {
    padding: 8px;
    border-bottom: 1px solid #ddd;
}
</style>

</head>
<body>

<h1>🎮 Aufgaben-Spiel</h1>

<div id="playerArea">
    <input
        type="text"
        id="playerName"
        placeholder="Spielername">

    <button onclick="selectPlayer()">
        Spieler starten
    </button>
</div>

<div id="scoreBoard">
    <div>
        Spieler:
        <strong id="activePlayer">-</strong>
    </div>

    <div class="score">
        Punkte:
        <span id="score">0</span>
    </div>

    <div>
        Highscore:
        <span id="highscore">0</span>
    </div>

    <br>

    <button onclick="resetScore()">
        Punktestand zurücksetzen
    </button>
</div>

<div id="gameArea"></div>

<div id="leaderboard">
    <h2>🏆 Bestenliste</h2>
    <ul id="leaderboardList"></ul>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>

const images = [
    "images/aufgabe1.png",
    "images/aufgabe2.png",
    "images/aufgabe3.png",
    "images/aufgabe4.png",
    "images/aufgabe5.png",
    "images/aufgabe6.png",
    "images/aufgabe7.png",
    "images/aufgabe8.png",
    "images/aufgabe9.png",
    "images/aufgabe10.png"
];

// Firebase-Konfiguration eintragen
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};

const isFirebaseConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db = null;
let gameRef = null;

if (isFirebaseConfigured) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    gameRef = db.ref("jetlag-regenspurge");
}

let players = {};
let currentPlayer = "";
let activeImages = [];

function getLocalState() {
    try {
        return JSON.parse(localStorage.getItem("jetlag-regenspurge")) || {};
    } catch (error) {
        return {};
    }
}

function saveLocalState() {
    localStorage.setItem("jetlag-regenspurge", JSON.stringify({
        players,
        activeImages
    }));
}

function persistState() {
    if (gameRef) {
        gameRef.set({ players, activeImages });
        return;
    }

    saveLocalState();
}

function initializeSharedState() {
    if (gameRef) {
        gameRef.on("value", (snapshot) => {
            const data = snapshot.val() || {};
            players = data.players || {};
            activeImages = data.activeImages || [];

            if (activeImages.length === 0) {
                initializeGame();
                return;
            }

            updatePlayerDisplay();
            render();
            updateLeaderboard();
        });
        return;
    }

    const saved = getLocalState();
    players = saved.players || {};
    activeImages = saved.activeImages || [];

    if (activeImages.length === 0) {
        initializeGame();
    } else {
        render();
    }

    updateLeaderboard();
}

function selectPlayer() {
    const name = document.getElementById("playerName").value.trim();

    if (name === "") {
        alert("Bitte Spielernamen eingeben.");
        return;
    }

    currentPlayer = name;

    if (!players[name]) {
        players[name] = { score: 0, highscore: 0 };
        persistState();
    }

    updatePlayerDisplay();

    if (activeImages.length === 0) {
        initializeGame();
    }
}

function updatePlayerDisplay() {
    if (!currentPlayer) return;

    document.getElementById("activePlayer").textContent = currentPlayer;
    document.getElementById("score").textContent = players[currentPlayer]?.score ?? 0;
    document.getElementById("highscore").textContent = players[currentPlayer]?.highscore ?? 0;

    updateLeaderboard();
}

function updateLeaderboard() {
    const list = document.getElementById("leaderboardList");
    list.innerHTML = "";

    const ranking = Object.entries(players).sort((a, b) => b[1].highscore - a[1].highscore);

    ranking.forEach(([name, data]) => {
        const li = document.createElement("li");
        li.textContent = `${name}: ${data.highscore} Punkte`;
        list.appendChild(li);
    });
}

function updateScore(points) {
    if (!currentPlayer) {
        alert("Bitte zuerst einen Spieler auswählen.");
        return;
    }

    if (!players[currentPlayer]) {
        players[currentPlayer] = { score: 0, highscore: 0 };
    }

    players[currentPlayer].score += points;

    if (players[currentPlayer].score > players[currentPlayer].highscore) {
        players[currentPlayer].highscore = players[currentPlayer].score;
    }

    persistState();
    updatePlayerDisplay();
}

function resetScore() {
    if (!currentPlayer) return;

    if (!players[currentPlayer]) {
        players[currentPlayer] = { score: 0, highscore: 0 };
    }

    players[currentPlayer].score = 0;
    persistState();
    updatePlayerDisplay();
}

function getRandomImage() {
    const available = images.filter(img => !activeImages.includes(img));

    if (available.length === 0) {
        return null;
    }

    return available[Math.floor(Math.random() * available.length)];
}

function initializeGame() {
    activeImages = [];

    for (let i = 0; i < 5; i++) {
        const image = getRandomImage();
        if (image) {
            activeImages.push(image);
        }
    }

    persistState();
    render();
}

function completeTask(index) {
    if (!currentPlayer) {
        alert("Bitte zuerst einen Spieler auswählen.");
        return;
    }

    if (!activeImages[index]) {
        return;
    }

    updateScore(10);

    activeImages.splice(index, 1);

    const nextImage = getRandomImage();
    if (nextImage) {
        activeImages.push(nextImage);
    }

    persistState();
    render();
}

function render() {
    const gameArea = document.getElementById("gameArea");
    gameArea.innerHTML = "";

    activeImages.forEach((image, index) => {
        const card = document.createElement("div");
        card.classList.add("card");

        card.innerHTML = `
            <img src="${image}" alt="Aufgabe">
            <button onclick="completeTask(${index})">
                ✅ Erledigt (+10 Punkte)
            </button>
        `;

        gameArea.appendChild(card);
    });
}

initializeSharedState();
updateLeaderboard();
</script>

</body>
</html>
